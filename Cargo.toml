[package]
name = "chess-to-market"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shakmaty = "0.27.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util", "process"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
